# Prometheus scrape config for the Campus Room Booking app.
#
# Local use:
#   prometheus --config.file=monitoring/prometheus.yml
#
# In Kubernetes, target the Service defined in k8s/service.yaml instead of
# localhost (e.g. devops-24eskcs050.default.svc.cluster.local:3000).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'campus-room-booking'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:3000']
        labels:
          app: devops-24eskcs050
