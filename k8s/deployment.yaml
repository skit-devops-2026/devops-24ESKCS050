apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-24eskcs050
  labels:
    app: devops-24eskcs050
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-24eskcs050
  template:
    metadata:
      labels:
        app: devops-24eskcs050
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: devops-24eskcs050
          image: ghcr.io/skit-devops-2026/devops-24eskcs050:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
